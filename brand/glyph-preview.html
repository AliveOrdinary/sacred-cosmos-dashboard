<style>

 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:860px}
 .cell{border:1px dashed rgba(216,213,206,.25);border-radius:6px;padding:16px 8px 10px;text-align:center}
 .cell .g{height:64px;display:flex;align-items:center;justify-content:center;color:#E8E2D5}
 .cell svg{height:56px;width:auto}
 .cell span{display:block;font-size:9.5px;letter-spacing:.08em;color:#B8B2A4;margin-top:10px}
 .cell:nth-child(n+13) .g{color:#D8593E}
</style></head><body>
