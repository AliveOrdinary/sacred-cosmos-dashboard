[build]
  command = "npm run build"
  publish = "dist"
  # Skip dashboard rebuilds when only homelab/n8n/brand files changed.
  # `brand/` comes OFF this list once constants.js consumes the tokens at build time.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)reels' ':(exclude)workflows' ':(exclude)brand' ':(exclude)DECISIONS.md'"

[build.environment]
  # Tell Netlify's secret scanner to specifically ignore these public keys
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL"

[[redirects]]
  from = "/api/publish"
  to = "/.netlify/functions/publish"
  status = 200

[[redirects]]
  from = "/api/render"
  to = "/.netlify/functions/render"
  status = 200
